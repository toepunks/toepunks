<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ToePunks — Mint</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Space Grotesk', sans-serif; }
  </style>
</head>
<body class="bg-black text-white min-h-screen flex items-center justify-center">

  <div class="text-center max-w-md mx-auto p-8">
    <h1 class="text-4xl font-bold mb-2">ToePunks</h1>
    <p class="text-gray-400 mb-8">Mint Your NFT</p>

    <!-- Connect Wallet -->
    <button id="connectBtn" onclick="connectWallet()" 
      class="w-full bg-white text-black font-bold py-3 px-6 rounded-lg hover:bg-gray-200 mb-4">
      Connect Wallet
    </button>

    <!-- Quantity -->
    <div id="qtySection" class="hidden mb-4">
      <span class="text-gray-400">Quantity:</span>
      <div class="flex items-center justify-center gap-4 mt-2">
        <button onclick="changeQty(-1)" class="bg-white/10 px-3 py-1 rounded">-</button>
        <span id="qty" class="text-xl font-bold">1</span>
        <button onclick="changeQty(1)" class="bg-white/10 px-3 py-1 rounded">+</button>
      </div>
    </div>

    <!-- Mint Button -->
    <button id="mintBtn" onclick="mint()" 
      class="w-full bg-gradient-to-r from-pink-500 to-purple-500 text-white font-bold py-3 px-6 rounded-lg hidden">
      Mint (Free)
    </button>

    <p id="status" class="text-gray-500 text-sm mt-4"></p>
  </div>

  <script>
    let walletAddress = null;
    let mintQty = 1;
    const CONTRACT = '0x0653513177c2ac2042eDa9BF6a603588Fc5eeDcf';

    async function connectWallet() {
      const status = document.getElementById('status');
      const connectBtn = document.getElementById('connectBtn');
      const mintBtn = document.getElementById('mintBtn');
      const qtySection = document.getElementById('qtySection');
      
      if (!window.ethereum) {
        alert('Please install MetaMask!');
        return;
      }
      
      try {
        const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
        walletAddress = accounts[0];
        connectBtn.textContent = walletAddress.slice(0, 10) + '...' + walletAddress.slice(-8);
        connectBtn.className = 'w-full bg-green-600 text-white font-bold py-3 px-6 rounded-lg mb-4';
        mintBtn.classList.remove('hidden');
        qtySection.classList.remove('hidden');
        status.textContent = 'Connected!';
      } catch (e) {
        status.textContent = 'Connection rejected. Please allow in MetaMask.';
      }
    }

    function changeQty(delta) {
      mintQty = Math.max(1, Math.min(10, mintQty + delta));
      document.getElementById('qty').textContent = mintQty;
      document.getElementById('mintBtn').textContent = 'Mint ' + mintQty + ' NFT' + (mintQty > 1 ? 's' : '') + ' (Free)';
    }

    async function mint() {
      if (!walletAddress) {
        alert('Please connect wallet first!');
        return;
      }
      
      const status = document.getElementById('status');
      const mintBtn = document.getElementById('mintBtn');
      
      try {
        status.textContent = 'Minting...';
        mintBtn.disabled = true;
        
        const provider = new ethers.providers.Web3Provider(window.ethereum);
        const signer = provider.getSigner();
        
        const contract = new ethers.Contract(CONTRACT, ['function mint(uint256) external payable'], signer);
        const tx = await contract.mint(mintQty, { value: 0 });
        
        status.textContent = 'Processing...';
        await tx.wait();
        
        status.textContent = '✅ Mint successful!';
        mintBtn.disabled = false;
      } catch (e) {
        status.textContent = 'Error: ' + e.message.slice(0, 50);
        mintBtn.disabled = false;
      }
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
</body>
</html>
