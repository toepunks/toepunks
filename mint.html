<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ToePunks — Mint Your NFT</title>
  <meta name="description" content="ToePunks - 10,000 unique digital collectibles on Ethereum">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Space Grotesk', sans-serif; }
    .gradient-text { background: linear-gradient(135deg, #ff6b6b, #feca57, #48dbfb); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .tile { aspect-ratio: 1; }
    .tile:hover { opacity: 0.8; }
  </style>
</head>
<body class="bg-black text-white min-h-screen">

  <!-- HEADER -->
  <header class="fixed top-0 left-0 right-0 z-50 bg-black/90 backdrop-blur-md border-b border-white/10">
    <div class="max-w-6xl mx-auto px-4 py-4 flex items-center justify-between">
      <div class="text-xl font-bold">ToePunks</div>
      <div class="flex items-center gap-6">
        <a href="index.html" class="text-gray-400 hover:text-white text-sm">Home</a>
        <a href="#stats" class="text-gray-400 hover:text-white text-sm">Stats</a>
      </div>
    </div>
  </header>

  <!-- HERO -->
  <section class="min-h-screen flex flex-col items-center justify-center px-4 pt-20">
    <div class="text-center max-w-2xl">
      <div class="inline-block px-3 py-1 bg-white/5 border border-white/10 rounded-full text-xs mb-4">
        Ethereum Mainnet
      </div>
      <h1 class="text-5xl md:text-7xl font-bold mb-4"><span class="gradient-text">ToePunks</span></h1>
      <p class="text-xl text-gray-400 mb-6">10,000 unique digital collectibles. Mint now!</p>
      
      <!-- MINT CARD -->
      <div class="bg-black border border-white/10 rounded-xl p-6 mb-8">
        <div class="grid grid-cols-2 gap-4 mb-4">
          <div><div class="text-2xl font-bold">10,000</div><div class="text-xs text-gray-500">Total</div></div>
          <div><div class="text-2xl font-bold" id="minted">0</div><div class="text-xs text-gray-500">Minted</div></div>
        </div>
        
        <!-- WALLET BUTTON -->
        <button id="connectBtn" onclick="connectWallet()" class="w-full bg-white text-black font-bold py-3 rounded-lg hover:bg-gray-200 transition">
          Connect Wallet
        </button>
        
        <!-- MINT BUTTON -->
        <button id="mintBtn" onclick="mint()" class="w-full bg-gradient-to-r from-pink-500 to-purple-500 text-white font-bold py-3 rounded-lg hover:opacity-90 transition hidden mt-3">
          Mint (Free)
        </button>
        
        <!-- QUANTITY -->
        <div id="qtySection" class="hidden mt-4">
          <label class="text-gray-400 text-sm">Quantity:</label>
          <div class="flex items-center justify-center gap-3 mt-2">
            <button onclick="changeQty(-1)" class="bg-white/10 px-3 py-1 rounded">-</button>
            <span id="qty" class="text-xl font-bold">1</span>
            <button onclick="changeQty(1)" class="bg-white/10 px-3 py-1 rounded">+</button>
          </div>
        </div>
        
        <p id="status" class="text-xs text-gray-500 mt-3 text-center"></p>
      </div>
    </div>
  </section>

  <!-- STATS -->
  <section id="stats" class="py-16 px-4 bg-white/5">
    <div class="max-w-4xl mx-auto">
      <h2 class="text-2xl font-bold mb-6 text-center">Stats</h2>
      <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
        <div class="bg-black border border-white/10 rounded-lg p-4 text-center">
          <div class="text-2xl font-bold">10,000</div><div class="text-xs text-gray-500">Supply</div>
        </div>
        <div class="bg-black border border-white/10 rounded-lg p-4 text-center">
          <div class="text-2xl font-bold" id="supplyStat">0</div><div class="text-xs text-gray-500">Minted</div>
        </div>
        <div class="bg-black border border-white/10 rounded-lg p-4 text-center">
          <div class="text-2xl font-bold">0</div><div class="text-xs text-gray-500">Holders</div>
        </div>
        <div class="bg-black border border-white/10 rounded-lg p-4 text-center">
          <div class="text-2xl font-bold">Free</div><div class="text-xs text-gray-500">Price</div>
        </div>
      </div>
    </div>
  </section>

  <footer class="py-8 px-4 border-t border-white/10 text-center text-gray-500 text-sm">
    © 2026 ToePunks
  </footer>

  <script>
    let walletAddress = null;
    let mintQty = 1;
    const CONTRACT = '0x0653513177c2ac2042eDa9BF6a603588Fc5eeDcf';
    
    // Load ethers
    let ethers;
    (async () => { ethers = window.ethers; })();
    
    async function connectWallet() {
      const status = document.getElementById('status');
      const connectBtn = document.getElementById('connectBtn');
      const mintBtn = document.getElementById('mintBtn');
      
      if (!window.ethereum) {
        alert('Please install MetaMask!');
        return;
      }
      const status = document.getElementById('status');
      const connectBtn = document.getElementById('connectBtn');
      const mintBtn = document.getElementById('mintBtn');
      const qtySection = document.getElementById('qtySection');
      
      if (typeof window.ethereum === 'undefined') {
        status.textContent = 'Please install MetaMask!';
        alert('Please install MetaMask browser extension!');
        return;
      }
      
      try {
        status.textContent = 'Connecting...';
        const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
        
        if (accounts.length === 0) {
          status.textContent = 'No account found!';
          return;
        }
        
        walletAddress = accounts[0];
        connectBtn.textContent = walletAddress.substring(0, 10) + '...' + walletAddress.substring(38);
        connectBtn.className = 'w-full bg-green-600 text-white font-bold py-3 rounded-lg';
        mintBtn.classList.remove('hidden');
        qtySection.classList.remove('hidden');
        status.textContent = 'Connected!';
        
        // Load ethers
        const script = document.createElement('script');
        script.src = 'https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js';
        script.onload = () => { window.ethers = ethers; };
        document.head.appendChild(script);
        
      } catch (e) {
        status.textContent = 'Error: ' + e.message;
      }
    }
    
    function changeQty(delta) {
      mintQty = Math.max(1, Math.min(10, mintQty + delta));
      document.getElementById('qty').textContent = mintQty;
      document.getElementById('mintBtn').textContent = 'Mint ' + mintQty + (mintQty > 1 ? ' NFTs' : ' NFT') + ' (Free)';
    }
    
    async function mint() {
      if (!walletAddress) {
        alert('Please connect wallet first!');
        return;
      }
      
      const status = document.getElementById('status');
      const mintBtn = document.getElementById('mintBtn');
      
      try {
        status.textContent = 'Minting...';
        mintBtn.disabled = true;
        
        // Wait for ethers
        while (!window.ethers) {
          await new Promise(r => setTimeout(r, 100));
        }
        
        const provider = new window.ethers.providers.Web3Provider(window.ethereum);
        const signer = provider.getSigner();
        
        const abi = ['function mint(uint256 quantity) external payable'];
        const contract = new window.ethers.Contract(CONTRACT, abi, signer);
        
        const tx = await contract.mint(mintQty, { value: 0 });
        status.textContent = 'Mining... ' + tx.hash.substring(0, 10) + '...';
        
        await tx.wait();
        
        status.textContent = '✅ Mint successful!';
        mintBtn.disabled = false;
        
      } catch (e) {
        status.textContent = 'Error: ' + e.message;
        mintBtn.disabled = false;
      }
    }
    
    // Check if already connected
    if (typeof window.ethereum !== 'undefined') {
      window.ethereum.request({ method: 'eth_accounts' }).then(accounts => {
        if (accounts.length > 0) {
          connectWallet();
        }
      });
    }
  </script>
</body>
</html>
